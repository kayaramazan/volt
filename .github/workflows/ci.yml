name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel older runs of the same PR
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────
  # Shared lint + typecheck (Linux, fast)
  # ─────────────────────────────────────────────────────────
  static:
    name: Lint + Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared + db packages
        # The desktop/backend depend on these — they need TS output present
        run: pnpm --filter @volt/shared --filter @volt/db build

      - name: Typecheck all workspaces
        run: pnpm -r typecheck

      - name: Lint all workspaces
        run: pnpm -r lint

  # ─────────────────────────────────────────────────────────
  # Backend tests (with Postgres service)
  # ─────────────────────────────────────────────────────────
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: volt
          POSTGRES_PASSWORD: volt-test
          POSTGRES_DB: volt_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://volt:volt-test@localhost:5432/volt_test?schema=public
      SESSION_SECRET: test-session-secret-at-least-32-chars-long
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @volt/shared --filter @volt/db build

      - name: Apply Prisma migrations
        run: pnpm --filter @volt/db prisma migrate deploy

      - name: Run backend tests
        run: pnpm --filter @volt/backend test
        # Tests cover sync logic, advisory locks, conflict log, auth

  # ─────────────────────────────────────────────────────────
  # Desktop build smoke test — verify each platform compiles
  # ─────────────────────────────────────────────────────────
  desktop:
    name: Desktop build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # Linux: build deps for native modules (better-sqlite3, keytar)
      - name: Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev libxss1

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @volt/shared build

      # Just compile + bundle; don't try to sign or upload here.
      # This catches platform-specific compile errors early.
      - name: Build renderer + electron bundles
        run: pnpm --filter @volt/desktop exec vite build
        env:
          # Skip auto-update / signing during CI
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Typecheck desktop
        run: pnpm --filter @volt/desktop typecheck

  # ─────────────────────────────────────────────────────────
  # Bundle size budget — fails PR if main chunk exceeds limit
  # ─────────────────────────────────────────────────────────
  budget:
    name: Bundle size budget
    runs-on: ubuntu-latest
    needs: desktop
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @volt/shared build
      - run: pnpm --filter @volt/desktop exec vite build

      - name: Check bundle size
        # Per the Stage 1 brief: renderer initial bundle must stay under
        # 1 MB gzip. We measure the entry chunk only — vendor chunks are
        # lazy-loaded so they don't block first paint.
        run: |
          ENTRY=$(find apps/desktop/dist/assets -name "index-*.js" | head -1)
          if [ -z "$ENTRY" ]; then
            echo "No entry bundle found at apps/desktop/dist/assets/index-*.js"
            exit 1
          fi
          SIZE=$(gzip -c "$ENTRY" | wc -c)
          LIMIT=1048576
          echo "Entry bundle gzip size: $SIZE bytes (limit: $LIMIT)"
          if [ "$SIZE" -gt "$LIMIT" ]; then
            echo "::error::Bundle size exceeds 1 MB gzip budget"
            exit 1
          fi
