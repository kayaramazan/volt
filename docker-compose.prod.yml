version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: volt-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
      - certbot-www:/var/www/certbot
    depends_on:
      - backend
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    container_name: volt-certbot
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    restart: unless-stopped

  backend:
    image: ghcr.io/${GITHUB_REPOSITORY:-volt}/backend:${VERSION:-latest}
    container_name: volt-backend
    environment:
      DATABASE_URL: postgresql://volt:${DB_PASSWORD}@postgres:5432/volt
      SESSION_SECRET: ${SESSION_SECRET}
      NODE_ENV: production
      PORT: 4000
      CORS_ORIGINS: ${CORS_ORIGINS:-app://*}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: volt-postgres
    environment:
      POSTGRES_USER: volt
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: volt
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U volt"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backup:
    image: postgres:16-alpine
    container_name: volt-backup
    volumes:
      - ./backups:/backups
    environment:
      PGPASSWORD: ${DB_PASSWORD}
    entrypoint: ["/bin/sh", "-c"]
    command: |
      "while true; do
        pg_dump -h postgres -U volt volt | gzip > /backups/volt-$$(date +%Y%m%d-%H%M%S).sql.gz
        find /backups -name 'volt-*.sql.gz' -mtime +7 -delete
        sleep 86400
      done"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  certbot-etc:
  certbot-var:
  certbot-www:
