version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: volt-postgres-dev
    environment:
      POSTGRES_USER: volt
      POSTGRES_PASSWORD: volt_dev_password
      POSTGRES_DB: volt
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U volt"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
