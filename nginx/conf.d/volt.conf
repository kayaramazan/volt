# Volt sync API
# - SSE endpoint needs proxy_buffering off + long timeouts
# - Auth endpoints get strict rate limiting

server {
    listen 80;
    server_name api.volt.dev;

    # Certbot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # After cert is issued, enable:
    # return 301 https://$host$request_uri;

    # SSE endpoint — buffering off, long read timeout, no compression
    # If buffering is on, events queue and clients get them in batches (defeats SSE)
    location /api/sync/stream {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE essentials
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        gzip off;

        # Allow SSE clients to reconnect quickly
        chunked_transfer_encoding off;
    }

    # Auth endpoints — strict rate limit
    location ~ ^/api/auth/(login|register) {
        limit_req zone=auth_limit burst=10 nodelay;
        proxy_pass http://backend:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Sync push/pull — higher rate limit
    location ~ ^/api/sync/(push|pull) {
        limit_req zone=sync_limit burst=100 nodelay;
        proxy_pass http://backend:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Everything else
    location / {
        limit_req zone=api_limit burst=40 nodelay;
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}

